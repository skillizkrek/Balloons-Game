<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Balloons</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
        #phone-viewport { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #07084f 0%, #02031c 100%); overflow: hidden; touch-action: none; }
        #ui-wrapper { position: absolute; top: 0; left: 0; width: 100%; background-color: #000; z-index: 20; border-bottom: 2px solid #33b5e5; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: none; }
        #ui { height: 50px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; pointer-events: none; }
        #controls { display: flex; align-items: center; gap: 15px; pointer-events: none; }
        #score { color: #33b5e5; font-size: 32px; font-weight: bold; text-shadow: 0 0 10px rgba(51, 181, 229, 0.8); line-height: 1; font-family: sans-serif; pointer-events: none; }
        .nav-btn { background: none; border: none; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.4; transition: opacity 0.2s; position: relative; -webkit-tap-highlight-color: transparent; pointer-events: auto; }
        .nav-btn:active { opacity: 1; }

        .pause-balloon-icon { width: 16px; height: 16px; background-color: #33b5e5; border-radius: 50%; position: relative; box-shadow: 0 0 8px rgba(51, 181, 229, 0.6); }
        .pause-balloon-icon::after { content: ""; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 4px solid #33b5e5; }

        .wave-icon {
            width: 16px; height: 16px; display: block;
            filter: drop-shadow(0 0 6px rgba(51, 181, 229, 0.6));
            transition: filter 0.15s ease-out;
            transform: translateY(2px);
        }
        .wave-icon .wave-arrow {
            fill: #33b5e5;
            transition: fill 0.15s ease-out;
        }

        .active-mode { opacity: 1 !important; }
        .active-mode .wave-icon { filter: drop-shadow(0 0 12px #33b5e5) drop-shadow(0 0 22px #33b5e5); }

        .beta-label {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translate(6px, -50%);
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #33b5e5;
            text-shadow: none;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Контейнер ЛОВИТ тапы — как в самой первой версии */
        .balloon-container {
            position: absolute;
            width: 85px;
            height: 100px;
            z-index: 5;
            pointer-events: auto;         /* ЛОВИТ ТАПЫ */
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .paused { animation-play-state: paused !important; }
        .paused, .paused * { pointer-events: none !important; }

        .balloon {
            position: absolute;
            top: 0; left: 0;
            width: 85px; height: 85px;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.3), inset 8px 8px 15px rgba(255,255,255,0.4);
        }
        .balloon::before {
            content: "";
            position: absolute;
            top: 14%; left: 14%;
            width: 24%; height: 14%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: rotate(-30deg);
            pointer-events: none;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8%;
            left: 50%;
            transform: translateX(-50%);
            width: 14%;
            height: 10%;
            background: currentColor;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            pointer-events: none;
        }

        @keyframes floatUp {
            0%   { transform: translate3d(0, 102vh, 0); }
            100% { transform: translate3d(0, -250px, 0); }
        }

        .particle {
            position: absolute;
            width: 8px; height: 8px; border-radius: 50%;
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
            z-index: 6;
            will-change: transform, opacity;
        }
        @keyframes explode {
            0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
            100% { transform: translate3d(var(--dx), var(--dy), 0) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="phone-viewport">
        <div id="ui-wrapper">
            <div id="ui">
                <div id="controls">
                    <button id="pause-btn" class="nav-btn">
                        <div class="pause-balloon-icon"></div>
                    </button>
                    <button id="wave-btn" class="nav-btn">
                        <svg class="wave-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                            <path class="wave-arrow" d="M0 0 L7 8 L0 16 Z" />
                            <path class="wave-arrow" d="M7 0 L14 8 L7 16 Z" />
                        </svg>
                        <span class="beta-label">Beta 1.0</span>
                    </button>
                </div>
                <span id="score">0</span>
            </div>
        </div>
    </div>
    <script>
        const viewport = document.getElementById('phone-viewport');
        const scoreEl = document.getElementById('score');
        const pauseBtn = document.getElementById('pause-btn');
        const waveBtn = document.getElementById('wave-btn');

        let score = 0;
        let isPaused = false;
        let isWaveMode = false;
        let modeChangedOnPause = false;
        let spawnTimeout;

        let BALLOON_WIDTH = 85;
        const MAX_ACTIVE = 3;

        let prevX = -1;

        // === АУДИО ===
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new Ctx();
            } catch (e) {
                audioCtx = null;
            }
        }

        function unlockAudio() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClick() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;

            const noiseLen = Math.floor(audioCtx.sampleRate * 0.008);
            const buf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < noiseLen; i++) {
                const t = i / noiseLen;
                d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 5);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buf;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 3500;
            noiseFilter.Q.value = 1.0;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.01);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
            noise.stop(now + 0.015);

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(900, now);
            osc1.frequency.exponentialRampToValueAtTime(500, now + 0.015);
            gain1.gain.setValueAtTime(0.0001, now);
            gain1.gain.exponentialRampToValueAtTime(0.3, now + 0.001);
            gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.025);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1800, now);
            gain2.gain.setValueAtTime(0.0001, now);
            gain2.gain.exponentialRampToValueAtTime(0.08, now + 0.001);
            gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.012);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now);
            osc2.stop(now + 0.015);
        }

        document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.addEventListener('pointerdown', unlockAudio, { once: true });

        // === Логика ===
        function updateSizes() {
            const W = viewport.clientWidth;
            BALLOON_WIDTH = Math.max(55, Math.min(100, Math.round(W * 0.17)));
        }

        window.addEventListener('resize', updateSizes);
        window.addEventListener('orientationchange', () => setTimeout(updateSizes, 200));
        updateSizes();

        const colors = ['#ff2a2a', '#33b5e5', '#ffcc00', '#ff6600', '#9933ff', '#33ff33'];
        let lastColorIndex = -1;

        const activeBalloons = new Map();
        let nextBalloonId = 0;

        function pickRandomX() {
            const W = viewport.clientWidth;
            const maxX = W - BALLOON_WIDTH;

            if (prevX < 0) {
                const x = Math.random() * maxX;
                prevX = x;
                return x;
            }

            for (let i = 0; i < 10; i++) {
                const x = Math.random() * maxX;
                if (Math.abs(x - prevX) > BALLOON_WIDTH + 20) {
                    prevX = x;
                    return x;
                }
            }

            const fallback = Math.random() * maxX;
            prevX = fallback;
            return fallback;
        }

        function createBalloon(leftPos) {
            const id = nextBalloonId++;

            const container = document.createElement('div');
            const balloon = document.createElement('div');

            let colorIndex = Math.floor(Math.random() * colors.length);
            while (colorIndex === lastColorIndex) {
                colorIndex = Math.floor(Math.random() * colors.length);
            }
            lastColorIndex = colorIndex;
            const color = colors[colorIndex];

            container.className = 'balloon-container';
            balloon.className = 'balloon';

            balloon.style.backgroundColor = color;
            balloon.style.color = color;

            const w = BALLOON_WIDTH;

            balloon.style.width = w + 'px';
            balloon.style.height = w + 'px';

            container.style.width = w + 'px';
            container.style.height = (w + 15) + 'px';

            container.appendChild(balloon);

            container.style.left = `${leftPos}px`;

            activeBalloons.set(id, { el: container, x: leftPos });

            const duration = isWaveMode ? 1.6 : 6.0;

            let cleanedUp = false;

            const cleanup = () => {
                if (cleanedUp) return;
                cleanedUp = true;
                activeBalloons.delete(id);
                if (container.isConnected) container.remove();
            };

            let popped = false;

            const popHandler = (e) => {
                if (popped) return;
                if (isPaused) return;

                popped = true;

                e.preventDefault();
                e.stopPropagation();

                unlockAudio();
                playClick();

                const r = container.getBoundingClientRect();
                const vr = viewport.getBoundingClientRect();
                const cx = BALLOON_WIDTH / 2;

                for (let i = 0; i < 12; i++) {
                    const p = document.createElement('div');
                    const a = (i / 12) * Math.PI * 2 + Math.random() * 0.5;
                    const d = Math.random() * 60 + 40;
                    p.className = 'particle';
                    p.style.backgroundColor = color;
                    p.style.left = `${r.left - vr.left + cx}px`;
                    p.style.top = `${r.top - vr.top + cx}px`;
                    p.style.setProperty('--dx', `${Math.cos(a) * d}px`);
                    p.style.setProperty('--dy', `${Math.sin(a) * d}px`);
                    viewport.appendChild(p);
                    p.addEventListener('animationend', () => p.remove());
                }
                score++;
                scoreEl.textContent = score;
                cleanup();
            };

            // Контейнер ловит тапы — как в самой первой версии
            container.addEventListener('touchstart', popHandler, { passive: false });
            container.addEventListener('pointerdown', popHandler);

            container.addEventListener('animationend', cleanup);

            viewport.appendChild(container);

            void container.offsetHeight;
            container.style.animation = `floatUp ${duration}s linear forwards`;

            setTimeout(cleanup, duration * 1000 + 200);

            if (isPaused) container.classList.add('paused');
        }

        function scheduleSpawn() {
            if (isPaused) return;

            if (activeBalloons.size >= MAX_ACTIVE) {
                spawnTimeout = setTimeout(scheduleSpawn, 200);
                return;
            }

            const left = pickRandomX();
            createBalloon(left);

            let delay;
            if (isWaveMode) {
                delay = 150 + Math.random() * 100;
            } else {
                delay = 600 + Math.random() * 200;
            }

            spawnTimeout = setTimeout(scheduleSpawn, delay);
        }

        function resetField() {
            activeBalloons.clear();
            prevX = -1;
            document.querySelectorAll('.balloon-container').forEach(b => b.remove());
            score = 0;
            scoreEl.textContent = score;
        }

        function toggleWaveMode() {
            isWaveMode = !isWaveMode;
            resetField();

            if (isWaveMode) waveBtn.classList.add('active-mode');
            else waveBtn.classList.remove('active-mode');

            if (isPaused) {
                modeChangedOnPause = true;
            } else {
                clearTimeout(spawnTimeout);
                scheduleSpawn();
            }
        }

        let waveBusy = false;

        function waveTap(e) {
            e.preventDefault();
            e.stopPropagation();

            if (waveBusy) return;
            waveBusy = true;
            setTimeout(() => { waveBusy = false; }, 350);

            unlockAudio();
            toggleWaveMode();
        }

        waveBtn.addEventListener('touchstart', waveTap, { passive: false });
        waveBtn.addEventListener('pointerdown', waveTap);

        let pauseBusy = false;

        function pauseTap(e) {
            e.preventDefault();
            e.stopPropagation();

            if (pauseBusy) return;
            pauseBusy = true;
            setTimeout(() => { pauseBusy = false; }, 350);

            unlockAudio();
            togglePause();
        }

        pauseBtn.addEventListener('touchstart', pauseTap, { passive: false });
        pauseBtn.addEventListener('pointerdown', pauseTap);

        function togglePause() {
            isPaused = !isPaused;

            document.querySelectorAll('.balloon-container').forEach(b => {
                if (isPaused) {
                    b.classList.add('paused');
                } else {
                    b.classList.add('paused');
                    void b.offsetHeight;
                    b.classList.remove('paused');
                }
            });

            if (isPaused) {
                pauseBtn.style.opacity = '1';
                clearTimeout(spawnTimeout);
            } else {
                pauseBtn.style.opacity = '0.4';
                clearTimeout(spawnTimeout);
                if (modeChangedOnPause) {
                    modeChangedOnPause = false;
                    scheduleSpawn();
                } else {
                    spawnTimeout = setTimeout(scheduleSpawn, 300);
                }
            }
        }

        scheduleSpawn();
    </script>
</body>
</html>
