<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Balloons</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        #phone-viewport { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: radial-gradient(circle at center, #07084f 0%, #02031c 100%); 
            overflow: hidden; 
        }
        
        /* Чёрная плашка под чёлку */
        #ui-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #000;
            padding-top: env(safe-area-inset-top, 47px); 
            z-index: 20;
            border-bottom: 2px solid #33b5e5;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #ui { 
            height: 50px; 
            width: 100%;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 24px;
        }

        #score { color: #33b5e5; font-size: 32px; font-weight: bold; text-shadow: 0 0 10px rgba(51, 181, 229, 0.8); line-height: 1; }
        
        /* Кнопка паузы в виде мини-шарика */
        #pause-btn { background: none; border: none; padding: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.4; transition: opacity 0.2s; margin-left: -5px; }
        #pause-btn:active { opacity: 1; }
        
        /* Идеально ровный круглый значок паузы-шарика */
        .pause-balloon-icon { 
            width: 16px; 
            height: 16px; 
            background-color: #33b5e5; 
            border-radius: 50%; 
            position: relative;
            box-shadow: 0 0 8px rgba(51, 181, 229, 0.6);
        }
        /* Хвостик шарика снизу */
        .pause-balloon-icon::after { 
            content: ""; 
            position: absolute; 
            bottom: -3px; 
            left: 50%; 
            transform: translateX(-50%); 
            border-left: 3px solid transparent; 
            border-right: 3px solid transparent; 
            border-bottom: 4px solid #33b5e5; 
        }

        .balloon-container { position: absolute; width: 85px; height: 180px; cursor: pointer; animation: floatUp linear forwards; will-change: transform; z-index: 5; }
        .paused { animation-play-state: paused !important; }

        .balloon { position: absolute; top: 0; left: 0; width: 85px; height: 85px; border-radius: 50%; box-shadow: inset -8px -8px 15px rgba(0,0,0,0.3), inset 8px 8px 15px rgba(255,255,255,0.4); }
        .balloon::before { content: ""; position: absolute; top: 12px; left: 12px; width: 20px; height: 12px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; transform: rotate(-30deg); }
        .balloon::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid currentColor; }
        .string { position: absolute; top: 88px; left: 50%; width: 2px; height: 70px; transform: translateX(-50%); clip-path: polygon(0% 0%, 100% 10%, 0% 20%, 100% 30%, 0% 40%, 100% 50%, 0% 60%, 100% 70%, 0% 80%, 100% 90%, 0% 100%); }
        
        @keyframes floatUp { 
            0% { transform: translateY(102vh); } 
            100% { transform: translateY(-200px); } 
        }
        
        .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: explode 0.4s ease-out forwards; z-index: 6; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
    </style>
</head>
<body>
    <div id="phone-viewport">
        <div id="ui-wrapper">
            <div id="ui">
                <button id="pause-btn">
                    <!-- Новый значок в виде круглого шарика -->
                    <div class="pause-balloon-icon"></div>
                </button>
                <span id="score">0</span>
            </div>
        </div>
    </div>
    <script>
        const viewport = document.getElementById('phone-viewport'), 
              scoreEl = document.getElementById('score'),
              pauseBtn = document.getElementById('pause-btn');
              
        let score = 0; 
        let isPaused = false;
        let spawnTimeout;
        const colors = ['#ff3366', '#00ffcc', '#ffcc00', '#ff6600', '#9933ff', '#33ff33'];
        
        function gameLoop() {
            if (isPaused) return;

            const container = document.createElement('div'), balloon = document.createElement('div'), string = document.createElement('div'), color = colors[Math.floor(Math.random() * colors.length)];
            container.className = 'balloon-container'; balloon.className = 'balloon'; string.className = 'string';
            balloon.style.backgroundColor = balloon.style.color = string.style.background = color;
            container.appendChild(balloon); container.appendChild(string);
            
            container.style.left = `${Math.random() * (viewport.clientWidth - 95) + 5}px`;
            container.style.animationDuration = '6.0s';
            
            const pop = (e) => {
                if (isPaused) return; 
                e.preventDefault(); e.stopPropagation();
                const r = container.getBoundingClientRect(), vr = viewport.getBoundingClientRect();
                for (let i = 0; i < 12; i++) {
                    const p = document.createElement('div'), a = (i / 12) * Math.PI * 2 + Math.random() * 0.5, d = Math.random() * 60 + 40;
                    p.className = 'particle'; p.style.backgroundColor = color; p.style.left = `${r.left - vr.left + 42.5}px`; p.style.top = `${r.top - vr.top + 42.5}px`;
                    p.style.setProperty('--dx', `${Math.cos(a) * d}px`); p.style.setProperty('--dy', `${Math.sin(a) * d}px`);
                    viewport.appendChild(p); p.addEventListener('animationend', () => p.remove());
                }
                score++; scoreEl.textContent = score; container.remove();
            };
            
            container.addEventListener('touchstart', pop, { passive: false }); 
            container.addEventListener('mousedown', pop);
            container.addEventListener('animationend', () => { if (viewport.contains(container)) container.remove(); });
            viewport.appendChild(container); 
            
            spawnTimeout = setTimeout(gameLoop, 1300);
        }

        pauseBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            togglePause();
        });
        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePause();
        });

        function togglePause() {
            isPaused = !isPaused;
            const balloons = document.querySelectorAll('.balloon-container');
            
            balloons.forEach(b => {
                if (isPaused) {
                    b.classList.add('paused');
                } else {
                    b.classList.add('paused'); 
                    b.offsetHeight; 
                    b.classList.remove('paused');
                }
            });

            if (isPaused) {
                pauseBtn.style.opacity = '1';
                clearTimeout(spawnTimeout);
            } else {
                pauseBtn.style.opacity = '0.4';
                spawnTimeout = setTimeout(gameLoop, 600);
            }
        }

        gameLoop();
    </script>
</body>
</html>
