<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>Balloons-Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Roboto';
            src: url('Roboto-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
            background: #000;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }

        #phone-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #phone-viewport.active {
            opacity: 1;
            background: radial-gradient(circle at center, #07084f 0%, #02031c 100%);
        }

        #ui-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #000;
            padding-top: env(safe-area-inset-top, 10px);
            z-index: 20;
        }
        @media (display-mode: standalone) { #ui-wrapper { padding-top: calc(env(safe-area-inset-top, 47px) + 15px); } }

        #ui { height: 50px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }

        #controls { display: flex; align-items: center; gap: 15px; margin-left: -10px; }

        #alpha-label {
            color: #33b5e5;
            font-family: 'Roboto', monospace;
            font-size: 18px;
            font-weight: 400;
            opacity: 0.45;
            letter-spacing: 0.5px;
            line-height: 1;
            margin-left: -3px;
        }
        #alpha-label.active-mode {
            opacity: 1;
        }

        #score {
            color: #33b5e5;
            font-size: 32px;
            line-height: 1;
            font-family: 'Roboto', monospace;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.4;
        }
        .nav-btn.active-mode { opacity: 1; }

        .pause-balloon-icon {
            width: 16px;
            height: 16px;
            background-color: #33b5e5;
            border-radius: 50%;
            position: relative;
        }
        .pause-balloon-icon::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-bottom: 4px solid #33b5e5;
        }

        .wave-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }
        .wave-icon::before,
        .wave-icon::after {
            content: "";
            width: 8px;
            height: 16px;
            background-color: #33b5e5;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }
        .wave-icon::after {
            margin-left: -1px;
        }

        .home-icon {
            width: 18px;
            height: 18px;
            position: relative;
        }
        .home-icon::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 9px solid #33b5e5;
        }
        .home-icon::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 18px;
            height: 9px;
            background-color: #33b5e5;
        }

        .balloon-container { position: absolute; width: 85px; height: 180px; cursor: pointer; animation: floatUp linear forwards; will-change: transform; z-index: 5; }
        .paused { animation-play-state: paused !important; }
        .balloon { position: absolute; top: 0; left: 0; width: 85px; height: 85px; border-radius: 50%; box-shadow: inset -8px -8px 15px rgba(0,0,0,0.3), inset 8px 8px 15px rgba(255,255,255,0.4); }
        .balloon::before { content: ""; position: absolute; top: 12px; left: 12px; width: 20px; height: 12px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; transform: rotate(-30deg); }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid currentColor;
        }
        @keyframes floatUp { 0% { transform: translateY(102vh); } 100% { transform: translateY(-200px); } }

        .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: explode 0.4s ease-out forwards; z-index: 6; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

        #game-menu {
            position: fixed;
            inset: 0;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            opacity: 1;
            visibility: visible;
            animation: menuFadeIn 0.4s ease-out;
        }

        @keyframes menuFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #game-menu.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .holo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 85px;
            padding-top: env(safe-area-inset-top, 0px);
            background-color: #000;
            position: relative;
            padding-right: 20px;
            flex-shrink: 0;
        }

        .holo-tab {
            color: #fff;
            font-size: 21px;
            font-weight: 400;
            padding: 0 20px;
            cursor: pointer;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .holo-tab:active { background-color: rgba(51, 181, 229, 0.4); }
        .holo-tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 9px;
            background-color: #33B5E5;
        }

        .market-title {
            color: #C3C3C3;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .holo-underline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #33B5E5;
        }

        .menu-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            padding-top: 25px;
            overflow-y: auto;
        }

        .list-item {
            width: 100%;
            padding: 22px 18px;
            cursor: pointer;
            background-color: #000;
            border: none;
        }

        #start-btn {
            margin-top: 30px;
            border-top: 2px solid #2a2a2a;
            border-bottom: 2px solid #2a2a2a;
        }

        #about-btn {
            border-bottom: 2px solid #2a2a2a;
        }

        .list-item:active { background-color: rgba(51, 181, 229, 0.4); }

        .item-text {
            color: #C3C3C3;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .list-item:active .item-text { color: #fff; }

        .menu-version {
            margin-top: auto;
            padding: 22px 24px calc(22px + env(safe-area-inset-bottom, 0px)) 24px;
            color: #33b5e5;
            font-family: 'Roboto', monospace;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 1;
            text-align: right;
        }

        #about-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        #about-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        #about-box {
            background: #0a0a0a;
            border: 2px solid #33B5E5;
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            color: #C3C3C3;
            transform: translateY(10px);
            transition: transform 0.25s ease;
        }
        #about-overlay.visible #about-box { transform: translateY(0); }

        #about-box h2 {
            color: #33B5E5;
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            padding: 22px 24px 18px 24px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #33B5E5;
        }

        .about-body {
            padding: 22px 24px;
        }

        .about-body p {
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 18px 0;
            color: #C3C3C3;
        }

        .controls-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 28px;   /* сдвиг туториала вниз */
            margin-bottom: 6px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .control-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .control-text {
            font-size: 14px;
            line-height: 1.4;
            color: #C3C3C3;
        }
        .control-text b {
            color: #fff;
            font-weight: 400;
        }

        .about-close {
            display: block;
            width: calc(100% - 48px);
            margin: 6px 24px 22px 24px;
            padding: 14px;
            background: #33B5E5;
            color: #000;
            font-size: 17px;
            font-weight: 400;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .about-close:active { opacity: 0.7; }

        #pause-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        #pause-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        #pause-box {
            background: #0a0a0a;
            border: 2px solid #33B5E5;
            max-width: 440px;
            width: 100%;
            transform: translateY(10px);
            transition: transform 0.25s ease;
        }
        #pause-overlay.visible #pause-box { transform: translateY(0); }

        #pause-box h2 {
            color: #33B5E5;
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            padding: 22px 24px 18px 24px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #33B5E5;
        }

        .pause-body {
            padding: 28px 24px;
        }

        .pause-score {
            color: #C3C3C3;
            font-family: 'Roboto', monospace;
            font-size: 28px;
            margin: 0;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }
        .pause-score span {
            color: #33B5E5;
        }

        .pause-btn-item {
            display: block;
            width: calc(100% - 48px);
            margin: 0 24px 12px 24px;
            padding: 16px;
            background: #33B5E5;
            color: #000;
            font-size: 17px;
            font-weight: 400;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .pause-btn-item:last-of-type {
            margin-bottom: 24px;
        }
        .pause-btn-item:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div id="phone-viewport">
        <div id="ui-wrapper">
            <div id="ui">
                <div id="controls">
                    <button id="pause-btn" class="nav-btn">
                        <div class="pause-balloon-icon"></div>
                    </button>
                    <button id="wave-btn" class="nav-btn">
                        <div class="wave-icon"></div>
                    </button>
                    <span id="alpha-label">Alpha 1.3.1</span>
                </div>
                <span id="score">0</span>
            </div>
        </div>
    </div>

    <div id="game-menu">
        <div class="holo-header">
            <div class="holo-tab" id="tab-game">Game</div>
            <div class="market-title">Balloons-Game</div>
            <div class="holo-underline"></div>
        </div>

        <div class="menu-content">
            <div class="list-item" id="start-btn">
                <div class="item-text">Play</div>
            </div>
            <div class="list-item" id="about-btn">
                <div class="item-text">How to play</div>
            </div>
            <div class="menu-version">Alpha 1.3.1</div>
        </div>
    </div>

    <div id="about-overlay">
        <div id="about-box">
            <h2>How to play</h2>

            <div class="about-body">
                <p>
                    Pop the balloons before they fly away. Each popped balloon gives you one point -
                    try to beat your high score!
                </p>

                <div class="controls-list">
                    <div class="control-row">
                        <div class="control-icon">
                            <div class="pause-balloon-icon"></div>
                        </div>
                        <!-- заменили resume на continue -->
                        <div class="control-text"><b>Balloon</b> - Pause / continue, back to menu</div>
                    </div>

                    <div class="control-row">
                        <div class="control-icon">
                            <div class="wave-icon"></div>
                        </div>
                        <div class="control-text"><b>Double arrow</b> - Speed mode (wave)</div>
                    </div>
                </div>
            </div>

            <button class="about-close" id="about-close">Close</button>
        </div>
    </div>

    <div id="pause-overlay">
        <div id="pause-box">
            <h2>Pause</h2>
            <div class="pause-body">
                <p class="pause-score">Score - <span id="pause-score-value">0</span></p>
            </div>
            <button class="pause-btn-item" id="pause-continue">Continue</button>
            <button class="pause-btn-item" id="pause-to-menu">Back to menu</button>
        </div>
    </div>

    <script>
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
        document.addEventListener('contextmenu', e => e.preventDefault());

        const viewport = document.getElementById('phone-viewport');
        const scoreEl = document.getElementById('score');
        const pauseBtn = document.getElementById('pause-btn');
        const waveBtn = document.getElementById('wave-btn');
        const alphaLabel = document.getElementById('alpha-label');

        const pauseOverlay = document.getElementById('pause-overlay');
        const pauseScoreValue = document.getElementById('pause-score-value');
        const pauseContinue = document.getElementById('pause-continue');
        const pauseToMenu = document.getElementById('pause-to-menu');

        let score = 0;
        let isPaused = false;
        let isWaveMode = false;
        let modeChangedOnPause = false;
        let spawnTimeout;
        let spawnTimeouts = [];
        let gameStarted = false;

        let lastColorIndex = -1;
        let lastLeftPosition = -1;
        const colors = ['#ff3366', '#00ffcc', '#ffcc00', '#ff6600', '#9933ff', '#33ff33'];

        function clearAllSpawns() {
            clearTimeout(spawnTimeout);
            spawnTimeouts.forEach(clearTimeout);
            spawnTimeouts = [];
        }

        function removeAllBalloons() {
            document.querySelectorAll('.balloon-container').forEach(b => b.remove());
        }

        function resetGame() {
            clearAllSpawns();
            removeAllBalloons();
            document.querySelectorAll('.particle').forEach(p => p.remove());
            score = 0;
            scoreEl.textContent = score;
            isPaused = false;
            isWaveMode = false;
            modeChangedOnPause = false;
            gameStarted = false;
            pauseBtn.classList.remove('active-mode');
            waveBtn.classList.remove('active-mode');
            alphaLabel.classList.remove('active-mode');
            pauseOverlay.classList.remove('visible');
        }

        function createBalloon() {
            const container = document.createElement('div');
            const balloon = document.createElement('div');

            let colorIndex = Math.floor(Math.random() * colors.length);
            while (colorIndex === lastColorIndex) {
                colorIndex = Math.floor(Math.random() * colors.length);
            }
            lastColorIndex = colorIndex;
            const color = colors[colorIndex];

            container.className = 'balloon-container';
            balloon.className = 'balloon';

            balloon.style.backgroundColor = color;
            balloon.style.color = color;

            container.appendChild(balloon);

            let leftPos = Math.random() * (viewport.clientWidth - 95) + 5;
            if (lastLeftPosition !== -1 && Math.abs(leftPos - lastLeftPosition) < 70) {
                leftPos = (leftPos + 100) % (viewport.clientWidth - 95);
                if (leftPos < 5) leftPos = 5;
            }
            lastLeftPosition = leftPos;
            container.style.left = `${leftPos}px`;

            container.style.animationDuration = isWaveMode ? '2.2s' : '7.0s';

            const pop = (e) => {
                if (isPaused || container.dataset.popped) return;
                container.dataset.popped = '1';
                e.preventDefault();
                e.stopPropagation();

                const r = container.getBoundingClientRect();
                const vr = viewport.getBoundingClientRect();

                for (let i = 0; i < 12; i++) {
                    const p = document.createElement('div');
                    const a = (i / 12) * Math.PI * 2 + Math.random() * 0.5;
                    const d = Math.random() * 60 + 40;
                    p.className = 'particle';
                    p.style.backgroundColor = color;
                    p.style.left = `${r.left - vr.left + 42.5}px`;
                    p.style.top = `${r.top - vr.top + 42.5}px`;
                    p.style.setProperty('--dx', `${Math.cos(a) * d}px`);
                    p.style.setProperty('--dy', `${Math.sin(a) * d}px`);
                    viewport.appendChild(p);
                    p.addEventListener('animationend', () => p.remove());
                }

                score++;
                scoreEl.textContent = score;
                container.remove();
            };

            container.addEventListener('touchstart', pop, { passive: false });
            container.addEventListener('mousedown', pop);

            container.addEventListener('animationend', () => {
                if (viewport.contains(container)) container.remove();
            });

            viewport.appendChild(container);

            if (isPaused) container.classList.add('paused');
        }

        function gameLoop() {
            if (isPaused || !gameStarted) return;

            createBalloon();

            if (isWaveMode) {
                spawnTimeouts.push(setTimeout(createBalloon, 150));
                spawnTimeouts.push(setTimeout(createBalloon, 300));
                spawnTimeouts.push(setTimeout(createBalloon, 450));
            }

            const delay = isWaveMode
                ? (600 + Math.random() * 400)
                : (400 + Math.random() * 600);

            spawnTimeout = setTimeout(gameLoop, delay);
        }

        function toggleWaveMode() {
            isWaveMode = !isWaveMode;

            removeAllBalloons();
            score = 0;
            scoreEl.textContent = score;

            if (isWaveMode) {
                waveBtn.classList.add('active-mode');
                alphaLabel.classList.add('active-mode');
            } else {
                waveBtn.classList.remove('active-mode');
                alphaLabel.classList.remove('active-mode');
            }

            if (isPaused) {
                modeChangedOnPause = true;
            } else {
                clearAllSpawns();
                gameLoop();
            }
        }

        function openPause() {
            if (isPaused) return;
            isPaused = true;
            pauseBtn.classList.add('active-mode');
            pauseScoreValue.textContent = score;
            clearAllSpawns();

            document.querySelectorAll('.balloon-container').forEach(b => b.classList.add('paused'));
            pauseOverlay.classList.add('visible');
        }

        function closePause() {
            if (!isPaused) return;
            isPaused = false;
            pauseBtn.classList.remove('active-mode');
            pauseOverlay.classList.remove('visible');

            document.querySelectorAll('.balloon-container').forEach(b => {
                b.classList.add('paused');
                void b.offsetHeight;
                b.classList.remove('paused');
            });

            if (modeChangedOnPause) {
                modeChangedOnPause = false;
                clearAllSpawns();
                gameLoop();
            } else {
                spawnTimeout = setTimeout(gameLoop, 400);
            }
        }

        pauseBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (isPaused) closePause(); else openPause();
        });
        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPaused) closePause(); else openPause();
        });

        waveBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); toggleWaveMode(); });
        waveBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleWaveMode(); });

        pauseContinue.addEventListener('click', closePause);

        pauseToMenu.addEventListener('click', () => {
            pauseOverlay.classList.remove('visible');
            resetGame();
            viewport.classList.remove('active');
            gameMenu.classList.remove('hidden');
        });

        const gameMenu = document.getElementById('game-menu');

        const startButton = document.getElementById('start-btn');
        const aboutButton = document.getElementById('about-btn');
        const gameTab     = document.getElementById('tab-game');

        startButton.addEventListener('click', () => {
            gameMenu.classList.add('hidden');
            viewport.classList.add('active');
            gameStarted = true;
            setTimeout(() => {
                gameLoop();
            }, 300);
        });

        gameTab.addEventListener('click', () => {
            console.log("Нажата вкладка Game");
        });

        const aboutOverlay = document.getElementById('about-overlay');
        const aboutClose = document.getElementById('about-close');

        aboutButton.addEventListener('click', () => {
            aboutOverlay.classList.add('visible');
