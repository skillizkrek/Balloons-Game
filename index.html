<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Balloons</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
        #phone-viewport { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #07084f 0%, #02031c 100%); overflow: hidden; touch-action: none; }
        #ui-wrapper { position: absolute; top: 0; left: 0; width: 100%; background-color: #000; padding-top: env(safe-area-inset-top, 10px); z-index: 20; border-bottom: 2px solid #33b5e5; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        @media (display-mode: standalone) { #ui-wrapper { padding-top: calc(env(safe-area-inset-top, 47px) + 15px); } }
        #ui { height: 50px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        #controls { display: flex; align-items: center; gap: 15px; }
        #score { color: #33b5e5; font-size: 32px; font-weight: bold; text-shadow: 0 0 10px rgba(51, 181, 229, 0.8); line-height: 1; font-family: sans-serif; }
        .nav-btn { background: none; border: none; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.4; transition: opacity 0.2s; position: relative; -webkit-tap-highlight-color: transparent; }
        .nav-btn:active { opacity: 1; }

        .pause-balloon-icon { width: 16px; height: 16px; background-color: #33b5e5; border-radius: 50%; position: relative; box-shadow: 0 0 8px rgba(51, 181, 229, 0.6); }
        .pause-balloon-icon::after { content: ""; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 4px solid #33b5e5; }

        .wave-icon {
            width: 16px; height: 16px; display: block;
            filter: drop-shadow(0 0 6px rgba(51, 181, 229, 0.6));
            transition: filter 0.15s ease-out;
            transform: translateY(2px);
        }
        .wave-icon .wave-arrow {
            fill: #33b5e5;
            transition: fill 0.15s ease-out;
        }

        .active-mode { opacity: 1 !important; }
        .active-mode .wave-icon { filter: drop-shadow(0 0 12px #33b5e5) drop-shadow(0 0 22px #33b5e5); }

        .beta-label {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translate(6px, -50%);
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #33b5e5;
            text-shadow: none;
            pointer-events: none;
            white-space: nowrap;
        }

        .balloon-container {
            position: absolute;
            cursor: pointer;
            animation: floatUp linear forwards;
            will-change: transform;
            z-index: 5;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .paused { animation-play-state: paused !important; }
        .paused, .paused * { pointer-events: none !important; }

        .balloon {
            position: absolute;
            top: 0; left: 0;
            width: 85px; height: 85px;
            border-radius: 50%;
            box-shadow:
                inset -8px -8px 15px rgba(0,0,0,0.3),
                inset 8px 8px 15px rgba(255,255,255,0.4);
            overflow: hidden;
            z-index: 2;
        }

        /* Блик сверху-слева */
        .balloon::before {
            content: "";
            position: absolute;
            top: 14%;
            left: 14%;
            width: 24%;
            height: 14%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: rotate(-30deg);
            pointer-events: none;
        }

        /* Узелок — снаружи шарика, под ним, средний размер */
        .knot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid currentColor;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0%   { transform: translate3d(0, 102vh, 0); }
            100% { transform: translate3d(0, -200px, 0); }
        }
        .particle {
            position: absolute;
            width: 8px; height: 8px; border-radius: 50%;
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
            z-index: 6;
            will-change: transform, opacity;
        }
        @keyframes explode {
            0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
            100% { transform: translate3d(var(--dx), var(--dy), 0) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="phone-viewport">
        <div id="ui-wrapper">
            <div id="ui">
                <div id="controls">
                    <button id="pause-btn" class="nav-btn">
                        <div class="pause-balloon-icon"></div>
                    </button>
                    <button id="wave-btn" class="nav-btn">
                        <svg class="wave-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                            <path class="wave-arrow" d="M0 0 L7 8 L0 16 Z" />
                            <path class="wave-arrow" d="M7 0 L14 8 L7 16 Z" />
                        </svg>
                        <span class="beta-label">Alpha 1.0</span>
                    </button>
                </div>
                <span id="score">0</span>
            </div>
        </div>
    </div>
    <script>
        const viewport = document.getElementById('phone-viewport');
        const scoreEl = document.getElementById('score');
        const pauseBtn = document.getElementById('pause-btn');
        const waveBtn = document.getElementById('wave-btn');

        let score = 0;
        let isPaused = false;
        let isWaveMode = false;
        let modeChangedOnPause = false;
        let spawnTimeout;

        let BALLOON_WIDTH = 85;
        let MIN_HORIZONTAL_GAP = 50;
        let MIN_SPAWN_DELAY = 150;
        const MAX_SPAWN_ATTEMPTS = 40;
        const RECENT_X_MEMORY = 4;
        let RECENT_X_MIN_DISTANCE = 80;
        const recentXs = [];

        const MAX_ACTIVE_BALLOONS = 16;

        function updateSizes() {
            const W = viewport.clientWidth;
            BALLOON_WIDTH = Math.max(60, Math.min(110, Math.round(W * 0.18)));
            MIN_HORIZONTAL_GAP = Math.max(40, Math.round(W * 0.13));
            RECENT_X_MIN_DISTANCE = Math.round(W * 0.22);
        }

        window.addEventListener('resize', updateSizes);
        window.addEventListener('orientationchange', () => setTimeout(updateSizes, 200));
        updateSizes();

        const colors = ['#ff3366', '#00ffcc', '#ffcc00', '#ff6600', '#9933ff', '#33ff33'];
        let lastColorIndex = -1;

        const activeBalloons = new Map();
        let nextBalloonId = 0;

        function tryPickSafeLeft() {
            const maxLeft = Math.max(5, viewport.clientWidth - BALLOON_WIDTH - 10);
            const vr = viewport.getBoundingClientRect();

            const occupiedPositions = [];
            activeBalloons.forEach(({ el, x }) => {
                if (!el.isConnected) return;
                const r = el.getBoundingClientRect();
                if (r.bottom < vr.top - 150 || r.top > vr.bottom + 150) return;
                occupiedPositions.push(x);
            });

            for (let attempt = 0; attempt < MAX_SPAWN_ATTEMPTS; attempt++) {
                const candidate = Math.random() * (maxLeft - 5) + 5;

                const collides = occupiedPositions.some(x =>
                    Math.abs(x - candidate) < (BALLOON_WIDTH + MIN_HORIZONTAL_GAP)
                );

                const tooClose = recentXs.some(x =>
                    Math.abs(x - candidate) < RECENT_X_MIN_DISTANCE
                );

                if (!collides && !tooClose) return candidate;
            }

            for (let attempt = 0; attempt < MAX_SPAWN_ATTEMPTS; attempt++) {
                const candidate = Math.random() * (maxLeft - 5) + 5;
                const collides = occupiedPositions.some(x =>
                    Math.abs(x - candidate) < (BALLOON_WIDTH + MIN_HORIZONTAL_GAP)
                );
                if (!collides) return candidate;
            }

            return null;
        }

        function rememberX(x) {
            recentXs.push(x);
            if (recentXs.length > RECENT_X_MEMORY) recentXs.shift();
        }

        function createBalloon(leftPos) {
            const id = nextBalloonId++;

            const container = document.createElement('div');
            const balloon = document.createElement('div');
            const knot = document.createElement('div');

            let colorIndex = Math.floor(Math.random() * colors.length);
            while (colorIndex === lastColorIndex) {
                colorIndex = Math.floor(Math.random() * colors.length);
            }
            lastColorIndex = colorIndex;
            const color = colors[colorIndex];

            container.className = 'balloon-container';
            balloon.className = 'balloon';
            knot.className = 'knot';

            balloon.style.backgroundColor = color;
            knot.style.color = color;

            balloon.style.width = BALLOON_WIDTH + 'px';
            balloon.style.height = BALLOON_WIDTH + 'px';

            // Контейнер = ровно размер шарика + узелок (без нитки)
            // Хитбокс = контейнер, но нам нужен клик только по шарику
            const knotHeight = Math.round(BALLOON_WIDTH * 0.14); // ~12px при 85
            container.style.width = BALLOON_WIDTH + 'px';
            container.style.height = (BALLOON_WIDTH + knotHeight) + 'px';

            // Узелок точно под шариком
            knot.style.top = BALLOON_WIDTH + 'px';

            container.appendChild(balloon);
            container.appendChild(knot);

            container.style.left = `${leftPos}px`;

            activeBalloons.set(id, { el: container, x: leftPos });

            const duration = isWaveMode ? 2.5 : 6.0;
            container.style.animationDuration = `${duration}s`;

            const cleanup = () => {
                activeBalloons.delete(id);
                if (container.isConnected) container.remove();
            };

            let popped = false;

            const popHandler = (e) => {
                if (popped) return;
                if (isPaused) return;

                // Клик только по шарику (не по узелку)
                const rect = balloon.getBoundingClientRect();
                const x = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const y = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                // Радиус круга
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const r = rect.width / 2;
                const dx = x - cx;
                const dy = y - cy;
                if (dx * dx + dy * dy > r * r) return; // клик мимо шарика — игнор

                popped = true;

                e.preventDefault();
                e.stopPropagation();

                const r2 = container.getBoundingClientRect();
                const vr = viewport.getBoundingClientRect();
                const half = BALLOON_WIDTH / 2;

                for (let i = 0; i < 12; i++) {
                    const p = document.createElement('div');
                    const a = (i / 12) * Math.PI * 2 + Math.random() * 0.5;
                    const d = Math.random() * 60 + 40;
                    p.className = 'particle';
                    p.style.backgroundColor = color;
                    p.style.left = `${r2.left - vr.left + half}px`;
                    p.style.top = `${r2.top - vr.top + half}px`;
                    p.style.setProperty('--dx', `${Math.cos(a) * d}px`);
                    p.style.setProperty('--dy', `${Math.sin(a) * d}px`);
                    viewport.appendChild(p);
                    p.addEventListener('animationend', () => p.remove());
                }
                score++;
                scoreEl.textContent = score;
                cleanup();
            };

            // Слушаем на balloon, а не на container — хитбокс = сам шарик
            balloon.addEventListener('touchstart', popHandler, { passive: false });
            balloon.addEventListener('pointerdown', popHandler);
            container.addEventListener('animationend', cleanup);

            viewport.appendChild(container);
            if (isPaused) container.classList.add('paused');
        }

        function scheduleSpawn() {
            if (isPaused) return;

            if (activeBalloons.size >= MAX_ACTIVE_BALLOONS) {
                spawnTimeout = setTimeout(scheduleSpawn, 250);
                return;
            }

            const left = tryPickSafeLeft();

            if (left === null) {
                spawnTimeout = setTimeout(scheduleSpawn, 150);
                return;
            }

            createBalloon(left);
            rememberX(left);

            let delay;
            if (isWaveMode) {
                delay = 200 + Math.random() * 120;
            } else {
                delay = 450 + Math.random() * 200;
            }

            if (delay < MIN_SPAWN_DELAY) delay = MIN_SPAWN_DELAY;
            spawnTimeout = setTimeout(scheduleSpawn, delay);
        }

        function resetField() {
            activeBalloons.clear();
            recentXs.length = 0;
            document.querySelectorAll('.balloon-container').forEach(b => b.remove());
            score = 0;
            scoreEl.textContent = score;
        }

        function toggleWaveMode() {
            isWaveMode = !isWaveMode;
            resetField();

            if (isWaveMode) waveBtn.classList.add('active-mode');
            else waveBtn.classList.remove('active-mode');

            if (isPaused) {
                modeChangedOnPause = true;
            } else {
                clearTimeout(spawnTimeout);
                scheduleSpawn();
            }
        }

        let waveBusy = false;

        function waveTap(e) {
            e.preventDefault();
            e.stopPropagation();

            if (waveBusy) return;
            waveBusy = true;
            setTimeout(() => { waveBusy = false; }, 350);

            toggleWaveMode();
        }

        waveBtn.addEventListener('touchstart', waveTap, { passive: false });
        waveBtn.addEventListener('pointerdown', waveTap);

        let pauseBusy = false;

        function pauseTap(e) {
            e.preventDefault();
            e.stopPropagation();

            if (pauseBusy) return;
            pauseBusy = true;
            setTimeout(() => { pauseBusy = false; }, 350);

            togglePause();
        }

        pauseBtn.addEventListener('touchstart', pauseTap, { passive: false });
        pauseBtn.addEventListener('pointerdown', pauseTap);

        function togglePause() {
            isPaused = !isPaused;

            document.querySelectorAll('.balloon-container').forEach(b => {
                if (isPaused) {
                    b.classList.add('paused');
                } else {
                    b.classList.add('paused');
                    void b.offsetHeight;
                    b.classList.remove('paused');
                }
            });

            if (isPaused) {
                pauseBtn.style.opacity = '1';
                clearTimeout(spawnTimeout);
            } else {
                pauseBtn.style.opacity = '0.4';
                clearTimeout(spawnTimeout);
                if (modeChangedOnPause) {
                    modeChangedOnPause = false;
                    scheduleSpawn();
                } else {
                    spawnTimeout = setTimeout(scheduleSpawn, 400);
                }
            }
        }

        scheduleSpawn();
    </script>
</body>
</html>
